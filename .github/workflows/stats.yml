name: Update GitHub Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.sax.saxutils
          owner = os.environ['OWNER']
          token = os.environ['GH_TOKEN']
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          profile = get(f'https://api.github.com/users/{owner}')
          repos = get(f'https://api.github.com/users/{owner}/repos?per_page=100&sort=updated')
          languages = {}
          for repo in repos:
              language = repo.get('language')
              if language:
                  languages[language] = languages.get(language, 0) + 1
          top = sorted(languages.items(), key=lambda item: item[1], reverse=True)[:3]
          colors = {'TypeScript': '#3178c6', 'JavaScript': '#f1e05a', 'Kotlin': '#a97bff', 'C#': '#178600', 'HTML': '#e34c26', 'Python': '#3572A5'}
          esc = xml.sax.saxutils.escape
          stats = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img"><title>{esc(owner)} GitHub statistics</title><rect width="495" height="180" rx="8" fill="#141321"/><text x="24" y="36" fill="#fe428e" font-family="Arial,sans-serif" font-size="20" font-weight="700">GitHub Stats</text><text x="24" y="78" fill="#a9a9b3" font-family="Arial,sans-serif" font-size="13">Public repositories</text><text x="24" y="102" fill="#f8f8f2" font-family="Arial,sans-serif" font-size="24" font-weight="700">{profile['public_repos']}</text><text x="185" y="78" fill="#a9a9b3" font-family="Arial,sans-serif" font-size="13">Followers</text><text x="185" y="102" fill="#f8f8f2" font-family="Arial,sans-serif" font-size="24" font-weight="700">{profile['followers']}</text><text x="330" y="78" fill="#a9a9b3" font-family="Arial,sans-serif" font-size="13">Following</text><text x="330" y="102" fill="#f8f8f2" font-family="Arial,sans-serif" font-size="24" font-weight="700">{profile['following']}</text><text x="24" y="145" fill="#a9a9b3" font-family="Arial,sans-serif" font-size="12">Profile: github.com/{esc(owner)}</text></svg>'''
          rows = []
          for i, (name, count) in enumerate(top):
              y = 70 + i * 31
              width = max(40, min(300, count * 15))
              rows.append(f'<text x="24" y="{y}" fill="#f8f8f2" font-family="Arial,sans-serif" font-size="14">{esc(name)}</text><rect x="140" y="{y-11}" width="{width}" height="14" rx="7" fill="{colors.get(name, "#8be9fd")}"/>')
          langs = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img"><title>Most used programming languages</title><rect width="495" height="180" rx="8" fill="#282a36"/><text x="24" y="36" fill="#ff79c6" font-family="Arial,sans-serif" font-size="20" font-weight="700">Most Used Languages</text>{''.join(rows)}<text x="24" y="161" fill="#8be9fd" font-family="Arial,sans-serif" font-size="12">Based on public repositories</text></svg>'''
          open('stats.svg', 'w').write(stats)
          open('top-langs.svg', 'w').write(langs)
          PY
      - name: Commit updated stats
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats.svg top-langs.svg
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push